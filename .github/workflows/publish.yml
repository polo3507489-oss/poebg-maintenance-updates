name: Publish signed maintenance release

on:
  push:
    branches: [main]
    paths: ['release-input/**', 'scripts/**', '.github/workflows/publish.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify signatures, upload all files, then publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Publish-Release.ps1 -Request ./release-input/request.json
